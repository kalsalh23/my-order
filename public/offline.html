<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#243C32">
  <title>مندوب طيبة - غير متصل</title>
  <link rel="manifest" href="/manifest.json">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'IBM Plex Sans Arabic', 'Tajawal', system-ui, sans-serif;
      background: #F5F2EA;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: #30312E;
    }
    .container {
      text-align: center;
      max-width: 400px;
    }
    .logo {
      width: 100px;
      height: 100px;
      margin: 0 auto 24px;
      background: #243C32;
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .logo svg { width: 50px; height: 50px; color: white; }
    h1 { font-size: 1.75rem; font-weight: 600; margin-bottom: 12px; }
    p { color: #7D7567; line-height: 1.6; margin-bottom: 24px; }
    .btn {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 14px 28px;
      background: #243C32;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 500;
      cursor: pointer;
      font-family: inherit;
    }
    .btn:hover { background: #2D4A3F; }
    .features {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-top: 40px;
      padding-top: 24px;
      border-top: 1px solid #E8E4DA;
    }
    .feature {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      color: #7D7567;
      font-size: 0.875rem;
    }
    .feature svg { width: 28px; height: 28px; color: #243C32; }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" />
      </svg>
    </div>
    <h1>أنت غير متصل بالإنترنت</h1>
    <p>يبدو أن اتصالك بالإنترنت غير متاح حالياً. بعض الميزات قد لا تعمل حتى استعادة الاتصال.</p>
    <button class="btn" onclick="window.location.reload()">
      <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
        <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
      </svg>
      إعادة المحاولة
    </button>
    <div class="features">
      <div class="feature">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M16 11V7a4 4 0 00-8 0v4M5 9h14l1 12H4L5 9z" />
        </svg>
        السلة محفوظة
      </div>
      <div class="feature">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
        </svg>
        بيانات آمنة
      </div>
      <div class="feature">
        <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2">
          <path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
        مزامنة تلقائية
      </div>
    </div>
  </div>
  <script>
    // Auto-retry when online
    window.addEventListener('online', () => {
      window.location.reload()
    })

    // Register service worker if not already
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.ready.then(() => {
        console.log('Service worker ready')
      })
    }
  </script>
</body>
</html>
